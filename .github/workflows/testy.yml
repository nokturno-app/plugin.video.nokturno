name: testy
# testy jen na tag vydání, PR a ručně (od 2026-10-10: týdenní rytmus vydání, šetří minuty Actions)
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  testy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]   # 3.8 = Kodi 20 na Androidu a Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q default.py service.py resources/lib
      - name: addon.xml a settings.xml jsou platné XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('addon.xml'); ET.parse('resources/settings.xml'); print('ok')"
      - run: python -m unittest discover -s tests -v
